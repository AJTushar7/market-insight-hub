<header class="header" [class.scrolled]="isScrolled()">
  <div class="header-container">
    <!-- Logo -->
    <a routerLink="/" class="logo" (click)="closeMobileMenu()">
      <div class="logo-icon">
        <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="url(#logoGradient)" />
          <path
            d="M12 25L18 18L24 22L30 14"
            stroke="white"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="30" cy="14" r="2.5" fill="white" />
          <defs>
            <linearGradient
              id="logoGradient"
              x1="0"
              y1="0"
              x2="40"
              y2="40"
              gradientUnits="userSpaceOnUse"
            >
              <stop stop-color="#00BFA6" />
              <stop offset="1" stop-color="#00796B" />
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="logo-text">
        <span class="logo-name">Rising Stock</span>
        <span class="logo-tagline">of India</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-desktop">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: link.path === '/' }"
          class="nav-link"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <!-- CTA Buttons -->
    <div class="header-actions">
      <a routerLink="/auth/login" class="btn-login">Login</a>
      <a routerLink="/auth/register" class="btn-register">Get Started</a>
    </div>

    <!-- Mobile Menu Toggle -->
    <button
      class="mobile-menu-toggle"
      [class.active]="isMobileMenuOpen()"
      (click)="toggleMobileMenu()"
      aria-label="Toggle menu"
    >
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>
  </div>
</header>

<!-- Mobile Menu Overlay -->
<div
  class="mobile-menu-overlay"
  [class.open]="isMobileMenuOpen()"
  (click)="closeMobileMenu()"
></div>

<!-- Mobile Menu -->
<nav class="mobile-menu" [class.open]="isMobileMenuOpen()">
  <div class="mobile-menu-header">
    <span class="mobile-menu-title">Menu</span>
    <button class="mobile-menu-close" (click)="closeMobileMenu()" aria-label="Close menu">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>

  <div class="mobile-nav-links">
    @for (link of navLinks; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: link.path === '/' }"
        class="mobile-nav-link"
        (click)="closeMobileMenu()"
      >
        {{ link.label }}
      </a>
    }
  </div>

  <div class="mobile-menu-actions">
    <a routerLink="/auth/login" class="btn-login-mobile" (click)="closeMobileMenu()">Login</a>
    <a routerLink="/auth/register" class="btn-register-mobile" (click)="closeMobileMenu()"
      >Get Started</a
    >
  </div>

  <div class="mobile-menu-footer">
    <div class="sebi-badge">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
        <polyline points="9,12 12,15 16,10"></polyline>
      </svg>
      <span>SEBI Registered</span>
    </div>
  </div>
</nav>
